<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عبيد - إعادة تعيين كلمة المرور</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;width:min(430px,100%);padding:28px;border-radius:18px;box-shadow:0 10px 35px rgba(0,0,0,.12)}
h1{color:#1e40af;text-align:center;margin-top:0}label{display:block;margin:14px 0 7px;font-weight:700}
input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:50px;background:#1e40af;color:#fff;font-weight:700;font-size:16px}
#msg{text-align:center;margin-top:15px;line-height:1.7}
.success{color:#15803d}.error{color:#dc2626}
</style>
</head>
<body>
<div class="card">
<h1>🔐 إعادة تعيين كلمة المرور</h1>
<p style="text-align:center;color:#6b7280">أدخل كلمة المرور الجديدة لحسابك.</p>
<form id="form">
<label>كلمة المرور الجديدة</label><input id="password" type="password" minlength="6" required>
<label>تأكيد كلمة المرور</label><input id="confirm" type="password" minlength="6" required>
<button id="btn" type="submit">حفظ كلمة المرور</button>
</form>
<div id="msg"></div>
</div>
<script>
const SUPABASE_URL='https://pullcihxwmcoxqmzldqi.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1bGxjaGl4d21jb3hxbXpsZHFpIiwiaWF0IjoxNzc2NDk5NjU5LCJleHAiOjIwOTIwNzU2NTl9.TcT-rvrd8gO_4kv8WJM3Hw2MxyrqXyKDUBcDQVABs58';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const msg=document.getElementById('msg');
function show(t,c){msg.textContent=t;msg.className=c||''}
sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session) show('أدخل كلمة المرور الجديدة ثم اضغط حفظ.','success')});
document.getElementById('form').addEventListener('submit',async e=>{
e.preventDefault(); const p=document.getElementById('password').value, c=document.getElementById('confirm').value, b=document.getElementById('btn');
if(p.length<6)return show('كلمة المرور يجب أن تكون 6 أحرف على الأقل.','error');
if(p!==c)return show('كلمتا المرور غير متطابقتين.','error');
b.disabled=true;b.textContent='جارٍ الحفظ...';
try{const {error}=await sb.auth.updateUser({password:p});if(error)throw error;show('تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول إلى التطبيق.','success');document.getElementById('form').style.display='none';}
catch(err){show('تعذر تغيير كلمة المرور: '+(err.message||'الرابط منتهي أو غير صالح.'),'error');b.disabled=false;b.textContent='حفظ كلمة المرور';}
});
</script>
</body>
</html>
