name: One-time tracker auth fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: apply tracker/auth code corrections'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply tracker patch
        run: python scripts/one_time_tracker_fix.py

      - name: Validate patched file
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = [
              "const statusOrder = ['pending','accepted','assigned','in-progress','completed'];",
              'async function techStartProcessing(orderId)',
              "label: 'تم استلام الطلب'",
              "label: 'تم قبول الطلب'",
              "label: 'تم تعيين فني'",
              "label: 'جاري المعالجة'",
              "label: 'تم الانتهاء'",
          ]
          for x in required:
              assert x in s, x
          print('tracker patch validation passed')
          PY

      - name: Commit patched app and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/one-time-tracker-auth-fix.yml scripts/one_time_tracker_fix.py
          git commit -m "fix: apply tracker/auth code corrections"
          git push
