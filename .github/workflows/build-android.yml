name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          html = open('index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', html, flags=re.I|re.S)
          assert scripts, 'No inline JavaScript blocks found.'
          for i, code in enumerate(scripts, 1):
              path = f'/tmp/obied-inline-{i}.js'
              open(path, 'w', encoding='utf-8').write(code)
              print(path, len(code), 'chars')
          PY
          for f in /tmp/obied-inline-*.js; do
            [ -s "$f" ] || continue
            node --check "$f"
          done
          echo "Inline JavaScript syntax validation passed."

      - name: Validate canonical tracker flow
        run: |
          grep -Fq "const statusOrder = ['pending','accepted','assigned','on-the-way','in-progress','completed'];" index.html
          grep -Fq "async function techAssignOrder(orderId)" index.html
          grep -Fq "async function techOnTheWay(orderId)" index.html
          grep -Fq "async function techStartProcessing(orderId)" index.html
          grep -Fq "label: 'تم استلام الطلب'" index.html
          grep -Fq "label: 'تم قبول الطلب'" index.html
          grep -Fq "label: 'تم تعيين فني'" index.html
          grep -Fq "label: 'في الطريق'" index.html
          grep -Fq "label: 'جاري المعالجة'" index.html
          grep -Fq "label: 'تم الانتهاء'" index.html
          grep -Fq "sb.rpc('accept_order', { p_order_id: orderId })" index.html
          grep -Fq "sb.rpc('advance_tech_order_stage'" index.html
          grep -Fq "window.Capacitor?.Plugins?.Geolocation" index.html
          echo "Canonical tracker validation passed."

      - name: Validate application fixes before Android build
        run: |
          grep -Fq "complete_tech_order" index.html
          grep -Fq "create_tech_invoice" index.html
          grep -Fq "tech_verify_invoice_payment" index.html
          grep -Fq "create_my_user_profile" index.html
          grep -Fq "enableNativePush" index.html
          echo "Application fix validation passed."

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www/assets
          cp index.html www/index.html
          curl -fL --retry 3 https://raw.githubusercontent.com/Open-Syria/data-geography/main/data/districts.json -o www/assets/syria-districts.json
          curl -fL --retry 3 https://raw.githubusercontent.com/Open-Syria/data-geography/main/data/subdistricts.json -o www/assets/syria-subdistricts.json
          python3 - <<'PY'
          import json
          for path in ['www/assets/syria-districts.json','www/assets/syria-subdistricts.json']:
              data=json.load(open(path,encoding='utf-8'))
              assert isinstance(data,list) and data, path
              print(path, len(data), 'records')
          assert len(json.load(open('www/assets/syria-subdistricts.json',encoding='utf-8'))) == 272
          PY

      - name: Add Android platform
        run: npx cap add android

      - name: Add Android share receiver
        run: |
          mkdir -p android/app/src/main/java/com/obied/maintenance
          cp native/android/ShareReceiverPlugin.java android/app/src/main/java/com/obied/maintenance/ShareReceiverPlugin.java
          python3 - <<'PY'
          import re
          from pathlib import Path

          # Register the custom Capacitor plugin and preserve the generated MainActivity.
          main = Path('android/app/src/main/java/com/obied/maintenance/MainActivity.java')
          content = main.read_text(encoding='utf-8')
          if 'ShareReceiverPlugin' not in content:
              content = content.replace('import com.getcapacitor.BridgeActivity;', 'import com.getcapacitor.BridgeActivity;\\nimport com.obied.maintenance.ShareReceiverPlugin;')
              content = content.replace('public class MainActivity extends BridgeActivity {', 'public class MainActivity extends BridgeActivity {\\n    @Override\\n    public void onCreate(android.os.Bundle savedInstanceState) {\\n        registerPlugin(ShareReceiverPlugin.class);\\n        ShareReceiverPlugin.captureIntent(getIntent());\\n        super.onCreate(savedInstanceState);\\n    }\\n\\n    @Override\\n    public void onNewIntent(android.content.Intent intent) {\\n        super.onNewIntent(intent);\\n        setIntent(intent);\\n        ShareReceiverPlugin.captureIntent(intent);\\n    }')
          main.write_text(content, encoding='utf-8')

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8')
          if 'android.intent.action.SEND' not in m:
              activity = re.search(r'<activity\\b[\\s\\S]*?</activity>', m)
              if not activity:
                  raise SystemExit('Main activity not found in AndroidManifest.xml')
              block = activity.group(0)
              filters = '''
            <intent-filter>
                <action android:name="android.intent.action.SEND" />
                <category android:name="android.intent.category.DEFAULT" />
                <data android:mimeType="application/pdf" />
            </intent-filter>
            <intent-filter>
                <action android:name="android.intent.action.SEND" />
                <category android:name="android.intent.category.DEFAULT" />
                <data android:mimeType="image/jpeg" />
                <data android:mimeType="image/png" />
                <data android:mimeType="image/webp" />
            </intent-filter>
'''
              block2 = block.replace('</activity>', filters + '        </activity>')
              m = m.replace(block, block2, 1)
          manifest.write_text(m, encoding='utf-8')

          # Inject the web-side receiver after the app HTML is copied to www.
          web = Path('www/index.html')
          html = web.read_text(encoding='utf-8')
          script = '<script src="share-receiver.js"></script>'
          if script not in html:
              html = html.replace('</body>', script + '\\n</body>', 1)
          web.write_text(html, encoding='utf-8')
          Path('www/share-receiver.js').write_text(Path('scripts/share-receiver.js').read_text(encoding='utf-8'), encoding='utf-8')
          print('Android share receiver patched successfully')
          PY

      - name: Set Android version for update builds
        run: |
          python3 - <<'PY'
          import re
          path = 'android/app/build.gradle'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          run_number = int('${{ github.run_number }}')
          content = re.sub(r'versionCode\s+\d+', f'versionCode {run_number}', content, count=1)
          content = re.sub(r'versionName\s+\"[^\"]*\"', f'versionName \"1.0.{run_number}\"', content, count=1)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          print(f'Android version set to versionCode={run_number}, versionName=1.0.{run_number}')
          PY

      - name: Generate app icons and splash screen
        run: npx capacitor-assets generate --android

      - name: Patch AndroidManifest.xml for push notifications
        run: |
          python3 - <<'PY'
          import re
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          if 'android.permission.POST_NOTIFICATIONS' not in content:
              content = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />', content, count=1)
          if 'android.permission.ACCESS_FINE_LOCATION' not in content:
              content = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />', content, count=1)
          if 'android.permission.ACCESS_COARSE_LOCATION' not in content:
              content = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />', content, count=1)
          if 'default_notification_icon' not in content:
              content = content.replace('</application>', '    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap/ic_launcher" />\n  </application>')
          if 'default_notification_channel_id' not in content:
              content = content.replace('</application>', '    <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="obied_default" />\n  </application>')
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('AndroidManifest.xml patched successfully')
          PY

      - name: Validate Firebase secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON is missing."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -c "import json; d=json.load(open('android/app/google-services.json')); assert 'com.obied.maintenance' in [c.get('client_info',{}).get('android_client_info',{}).get('package_name') for c in d.get('client',[])]; print('Firebase configuration validated')"

      - name: Enable Google Services Gradle plugin
        run: |
          cat >> android/build.gradle <<'EOF'

          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.google.gms:google-services:4.4.2' }
          }
          EOF
          printf "%s\n" "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Validate release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "ERROR: GitHub Secret $name is missing."
              exit 1
            fi
          done
          python3 - <<'PY'
          import base64, os, re
          raw = os.environ["ANDROID_KEYSTORE_BASE64"]
          # Normalize copied/pasted Base64 from Termux/GitHub and restore optional padding.
          normalized = re.sub(r"\s+", "", raw)
          normalized += "=" * ((4 - len(normalized) % 4) % 4)
          try:
              data = base64.b64decode(normalized, validate=False)
          except Exception as exc:
              raise SystemExit(f"ERROR: ANDROID_KEYSTORE_BASE64 is not valid Base64: {exc}")
          if len(data) < 1024:
              raise SystemExit("ERROR: decoded keystore is unexpectedly small.")
          with open("android/app/obied-release.jks", "wb") as f:
              f.write(data)
          print(f"Release keystore decoded successfully ({len(data)} bytes).")
          PY
          test -s android/app/obied-release.jks
          keytool -list -keystore android/app/obied-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS"
          echo "Release keystore integrity and credentials validated."

      - name: Configure stable release signing
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("obied-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify release APK
        working-directory: android
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: obied-app-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: UBEYD Android v1.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
          asset_name: obied-app.apk
          body: |
            إصدار Android جديد من تطبيق عبيد للصيانة.
            رابط التحميل المباشر الثابت: https://github.com/obaidcom/obaid-app2/releases/latest/download/obied-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Rebuild after Auth registration/login hardening.

