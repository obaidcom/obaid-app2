name: Apply index security fixes

on: push

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index
        run: python3 tools/repair_index.py

      - name: Commit repair and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/fix-trigger .github/workflows/repair-index.yml tools/repair_index.py
          git add index.html .github/fix-trigger .github/workflows/repair-index.yml tools/repair_index.py
          git commit -m "fix: secure auth and technician flow"
          git push
