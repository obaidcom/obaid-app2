name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Apply canonical tracker fix once
        run: |
          if grep -q "const statusOrder = \['pending','accepted','assigned','in-progress','completed'\];" index.html && grep -q "async function techStartProcessing(orderId)" index.html; then
            echo "Canonical tracker already applied."
          else
            python3 scripts/one_time_tracker_fix.py
            python3 - <<'PY'
            from pathlib import Path
            s = Path('index.html').read_text(encoding='utf-8')
            required = [
              "const statusOrder = ['pending','accepted','assigned','in-progress','completed'];",
              'async function techStartProcessing(orderId)',
              "label: 'تم استلام الطلب'",
              "label: 'تم قبول الطلب'",
              "label: 'تم تعيين فني'",
              "label: 'جاري المعالجة'",
              "label: 'تم الانتهاء'",
              "sb.rpc('accept_order', { p_order_id: orderId })",
            ]
            for x in required:
              assert x in s, x
            print('canonical tracker validation passed')
            PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "fix: apply canonical tracker flow"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons and splash screen
        run: npx capacitor-assets generate --android

      - name: Patch AndroidManifest.xml for push notifications
        run: |
          python3 - <<'PY'
          import re
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          if 'android.permission.POST_NOTIFICATIONS' not in content:
              content = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />', content, count=1)
          if 'default_notification_icon' not in content:
              content = content.replace('</application>', '    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap/ic_launcher" />\n  </application>')
          if 'default_notification_channel_id' not in content:
              content = content.replace('</application>', '    <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="obied_default" />\n  </application>')
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('AndroidManifest.xml patched successfully')
          PY

      - name: Validate Firebase secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GitHub Actions secret GOOGLE_SERVICES_JSON is missing or empty."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('android/app/google-services.json').read_text(encoding='utf-8'))
          packages = [c.get('client_info', {}).get('android_client_info', {}).get('package_name') for c in data.get('client', [])]
          assert 'com.obied.maintenance' in packages, 'google-services.json does not contain com.obied.maintenance'
          print('Firebase configuration validated')
          PY

      - name: Enable Google Services Gradle plugin
        run: |
          cat >> android/build.gradle <<'EOF'

          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.google.gms:google-services:4.4.2' }
          }
          EOF
          printf "%s\n" "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: obied-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
